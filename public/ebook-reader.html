    <main class="content-wrapper">
        <div class="reader-wrapper">
            <!-- ✅ 모바일: 하단 툴바 + 접기/펼치기 / PC: 오른쪽 툴바 (CSS에서 반응형 처리) -->
            <!-- collapsed는 모바일에서 기본 접힘으로 시작(PC에서는 영향 거의 없음: CSS가 모바일에서만 collapsed 처리) -->
            <div class="reader-controls collapsed" id="readerControls">
                <!-- ✅ 모바일 전용 핸들(버튼): CSS에서 모바일에서만 보이게 처리 -->
                <button class="toggle-btn" id="readerToggleBtn" type="button" aria-expanded="false">
                    펼치기
                </button>

                <div class="font-controls">
                    <button class="vote-button" type="button" onclick="changeFontSize(-1)" aria-label="글자 크기 줄이기">
                        <i class="fa-solid fa-minus"></i>
                    </button>
                    <button class="vote-button" type="button" onclick="changeFontSize(1)" aria-label="글자 크기 키우기">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <div class="action-controls">
                    <button class="vote-button" type="button" onclick="saveBookmark()">

                    </button>

    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- ✅ 기존 사이트 공통 스크립트 -->
    <script src="/js/script.js"></script>

    <script>
        let fontSizeLevel = 3;
        const ebookId = window.location.pathname.split('/').pop();
        const loggedInUser = localStorage.getItem('loggedInUser') || 'guest';

        document.addEventListener('DOMContentLoaded', async () => {
            // ✅ 접기/펼치기 토글 세팅 (모바일 하단툴바)
            setupReaderControlsToggle();

            try {
                const response = await fetch(`/api/ebooks/${ebookId}`);
                if (!response.ok) throw new Error('데이터를 가져올 수 없습니다.');
                const ebook = await response.json();

                document.title = `안현민국 │ ${ebook.title}`;
                document.getElementById('viewer-title').innerText = ebook.title;
                document.getElementById('viewer-author').innerText = `${ebook.author} 지음 │ ${ebook.publisher}`;

                const viewer = new toastui.Editor({
                    el: document.querySelector('#viewer'),
                    viewer: true,
                    initialValue: ebook.content
                });

                loadReaderSettings();

            } catch (error) {
                console.error(error);
                Toastify({
                    text: "책을 불러오는 중 오류가 발생했습니다.",
                    backgroundColor: "red"
                }).showToast();
            }
        });

        function setupReaderControlsToggle() {
            const controls = document.getElementById('readerControls');
            const toggleBtn = document.getElementById('readerToggleBtn');
            if (!controls || !toggleBtn) return;

            // 저장된 상태 복원 (모바일에서 의미 큼)
            const saved = localStorage.getItem('readerControlsCollapsed');
            if (saved === 'false') controls.classList.remove('collapsed');
            if (saved === 'true') controls.classList.add('collapsed');

            const syncLabel = () => {
                const collapsed = controls.classList.contains('collapsed');
                toggleBtn.textContent = collapsed ? '펼치기' : '숨기기';
                toggleBtn.setAttribute('aria-expanded', String(!collapsed));
            };
            syncLabel();

            toggleBtn.addEventListener('click', () => {
                controls.classList.toggle('collapsed');
                localStorage.setItem('readerControlsCollapsed', String(controls.classList.contains('collapsed')));
                syncLabel();
            });
        }

        window.changeFontSize = (delta) => {
            fontSizeLevel = Math.max(1, Math.min(5, fontSizeLevel + delta));
            const viewerEl = document.getElementById('viewer');

            viewerEl.classList.remove('size-1','size-2','size-3','size-4','size-5');
            viewerEl.classList.add(`size-${fontSizeLevel}`);

            localStorage.setItem(`ebook_font_size`, String(fontSizeLevel));
        };

        window.saveBookmark = () => {
            const scrollPos = window.scrollY;
            localStorage.setItem(`bookmark_${ebookId}_${loggedInUser}`, String(scrollPos));
            Toastify({
                text: "현재 읽던 위치가 저장되었습니다.",
                backgroundColor: "green"
            }).showToast();
        };

        function loadReaderSettings() {
            const savedSize = localStorage.getItem(`ebook_font_size`);
            if (savedSize) {
                fontSizeLevel = parseInt(savedSize, 10);
                const viewerEl = document.getElementById('viewer');
                viewerEl.classList.remove('size-1','size-2','size-3','size-4','size-5');
                viewerEl.classList.add(`size-${fontSizeLevel}`);
            }

            const savedScroll = localStorage.getItem(`bookmark_${ebookId}_${loggedInUser}`);
            if (savedScroll) {
                if (confirm('이전에 읽던 지점이 있습니다. 이동하시겠습니까?')) {
                    window.scrollTo({ top: parseInt(savedScroll, 10), behavior: 'smooth' });
                }
            }
        }
    </script>
