            <form id="ebook-form">

                        <div class="cover-preview" onclick="document.getElementById('coverImage').click()">

                    </div>

                    <div class="info-inputs">
                        <div class="form-group">
                            <label for="title">도서명</label>
                            <input type="text" id="title" name="title" required placeholder="전자책 제목을 입력하세요.">
                        </div>
                        <div class="form-group">
                            <label for="author">저자명</label>
                            <input type="text" id="author" name="author" required placeholder="표시될 저자 이름을 입력하세요.">
                        </div>
                        <div class="form-group">

                        </div>
                        <div class="form-group">

                        </div>
                    </div>

                <div class="form-group">
                    <label>본문 집필</label>
                    <div id="editor"></div>
                </div>

                <div class="form-group">
                    <label for="tags">태그 (쉼표로 구분)</label>
                    <input type="text" id="tags" name="tags" placeholder="경제, 소설, IT, 안현민국">
                    <p class="tag-input-guide">예: 경제, 재테크, 가이드</p>
                </div>

                <div class="submit-area">
                    <!-- ✅ 버튼 클래스 업데이트 -->
                    <button type="button" class="button-secondary button-small" onclick="history.back()">취소</button>

    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- ✅ 공통 로직 -->
    <script src="/js/script.js"></script>

    <script>
        const loggedInUser = localStorage.getItem('loggedInUser');
        const ebookId = window.location.pathname.split('/').pop();
        const isEdit = window.location.pathname.includes('ebook-edit');

        const editor = new toastui.Editor({
            el: document.querySelector('#editor'),
            height: '500px',
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            placeholder: '글 내용을 작성해 주세요.'
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (!loggedInUser) {
                alert('로그인이 필요한 서비스입니다.');
                location.href = '/login';
                return;
            }

            if (isEdit && ebookId) {
                document.getElementById('page-title').innerHTML =
                    '<i class="fa-solid fa-pen-to-square"></i>⠀전자책 수정';
                document.getElementById('submit-btn').innerText = '수정 완료';

                try {
                    const response = await fetch(`/api/ebooks/${ebookId}`);
                    const data = await response.json();

                    if (data.authorId !== loggedInUser) {
                        alert('수정 권한이 없습니다.');
                        location.href = '/ebooks';
                        return;
                    }

                    document.getElementById('title').value = data.title;
                    document.getElementById('author').value = data.author;
                    document.getElementById('publisher').value = data.publisher || '';
                    document.getElementById('description').value = data.description || '';
                    document.getElementById('tags').value = data.tags ? data.tags.join(', ') : '';
                    editor.setMarkdown(data.content);

                    if (data.coverImage) {
                        const img = document.getElementById('preview-img');
                        img.src = data.coverImage;
                        img.style.display = 'block';
                        document.getElementById('preview-icon').style.display = 'none';
                    }
                } catch (e) {
                    console.error('데이터 로드 실패', e);
                }
            }
        });

        document.getElementById('coverImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ex) {
                    const img = document.getElementById('preview-img');
                    img.src = ex.target.result;
                    img.style.display = 'block';
                    document.getElementById('preview-icon').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('ebook-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = '처리 중...';

            const formData = new FormData(e.target);
            formData.append('content', editor.getMarkdown());
            formData.append('username', loggedInUser);

            const url = isEdit ? `/api/ebooks/${ebookId}` : '/api/ebooks';
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, { method, body: formData });
                const result = await response.json();

                if (response.ok) {
                    Toastify({ text: result.message, backgroundColor: "green" }).showToast();
                    setTimeout(() => location.href = '/ebooks', 1500);
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                Toastify({ text: err.message || '저장 실패', backgroundColor: "red" }).showToast();
                submitBtn.disabled = false;
                submitBtn.innerText = isEdit ? '수정 완료' : '출판하기';
            }
        });
    </script>
